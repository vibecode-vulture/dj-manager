[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-manager"
dynamic = ["version"]
description = "Genre-based music collection manager that syncs Spotify playlists (via spotdl) into Traktor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mutagen>=1.47",
    "packaging>=23",
    "certifi>=2024.2",
    "send2trash>=1.8",
]

[project.optional-dependencies]
window = ["pywebview>=5"]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.10"]

[project.scripts]
dj-manager = "djmanager.__main__:main"

[tool.setuptools]
packages = ["djmanager"]

[tool.setuptools.dynamic]
version = {attr = "djmanager.__version__"}

[tool.setuptools.package-data]
djmanager = ["static/*"]
