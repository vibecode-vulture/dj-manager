# Push a tag "v<version>" (matching djmanager/__init__.py) to build and publish a release.
# The in-app updater reads the latest release of this repository.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import djmanager; print(djmanager.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[window,build]"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - run: python packaging/build.py --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: test
    # oldest supported runner = widest glibc compatibility of the binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[build]"
      - run: python packaging/build.py --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
